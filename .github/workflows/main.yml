
name: Repair and Build AO3TV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rename package and repair AO3 configuration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path(".")
          gradle = root / "app/build.gradle.kts"

          if not gradle.exists():
              raise SystemExit("Missing app/build.gradle.kts")

          text = gradle.read_text(encoding="utf-8")
          text = text.replace(
              'namespace = "com.fixtok.tv"',
              'namespace = "org.wolfie.ao3tv"'
          )
          text = text.replace(
              'applicationId = "com.fixtok.tv"',
              'applicationId = "org.wolfie.ao3tv"'
          )
          gradle.write_text(text, encoding="utf-8")

          extensions = {
              ".kt", ".java", ".xml", ".json",
              ".properties", ".kts"
          }

          replacements = [
              ("https://www.tiktok.com", "https://archiveofourown.org"),
              ("http://www.tiktok.com", "https://archiveofourown.org"),
              ("https://m.tiktok.com", "https://archiveofourown.org"),
              ("http://m.tiktok.com", "https://archiveofourown.org"),
              ("https://tiktok.com", "https://archiveofourown.org"),
              ("http://tiktok.com", "https://archiveofourown.org"),
              ("www.tiktok.com", "archiveofourown.org"),
              ("m.tiktok.com", "archiveofourown.org"),
              ("tiktok.com", "archiveofourown.org"),
              ("com.fixtok.tv", "org.wolfie.ao3tv"),
          ]

          for base in (root / "app/src",):
              if not base.exists():
                  raise SystemExit(f"Missing source directory: {base}")

              for path in base.rglob("*"):
                  if not path.is_file() or path.suffix not in extensions:
                      continue

                  try:
                      original = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  updated = original
                  for old, new in replacements:
                      updated = updated.replace(old, new)

                  # Update user-visible labels without renaming
                  # Kotlin classes or internal method names.
                  if path.name == "strings.xml":
                      updated = updated.replace("FixTok 7", "AO3TV")
                      updated = updated.replace("FixTok", "AO3TV")
                      updated = updated.replace("TikTok", "AO3")

                  if updated != original:
                      path.write_text(updated, encoding="utf-8")
                      print(f"Updated: {path}")

          print("Package: org.wolfie.ao3tv")
          print("Website: https://archiveofourown.org/")
          PY

      - name: Verify package configuration
        run: |
          grep -q 'namespace = "org.wolfie.ao3tv"' \
            app/build.gradle.kts
          grep -q 'applicationId = "org.wolfie.ao3tv"' \
            app/build.gradle.kts
          grep -q 'name="app_name">AO3TV</string>' \
            app/src/main/res/values/strings.xml

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add app
          if ! git diff --cached --quiet; then
            git commit -m "Repair and rebrand AO3TV"
            git push
          fi

      - name: Run unit tests and build APK
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon \
            testDebugUnitTest assembleDebug \
            --stacktrace 2>&1 | tee build.log

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AO3TV-build-results
          path: |
            app/build/outputs/apk/debug/*.apk
            build.log
          if-no-files-found: warn
